version: 2

global:
  server_name: ${SERVER_NAME}
  private_key: /etc/dendrite/matrix_key.pem
  database:
    connection_string: ${SUPABASE_DB_URL}
    max_open_conns: 15
    max_idle_conns: 2

client_api:
  registration_disabled: true   # <--- Change this to true
  registration_shared_secret: ${REGISTRATION_SECRET}
  rate_limiting:
    enabled: true

sync_api:
  real_ip_header: "X-Forwarded-For"

media_api:
  base_path: /tmp/dendrite/media
